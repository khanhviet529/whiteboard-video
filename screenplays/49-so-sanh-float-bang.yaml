    head: Cái nào bỏ sót một nửa?
    narration: Hai hàm này kiểm xem một công việc đã hoàn thành chưa, bằng cách cộng tiến độ của từng phần lại. Chúng khác nhau đúng một phép so sánh. Bạn có ba giây để đoán hàm nào báo chưa xong dù đã xong.
    caption: Khác đúng một phép so sánh. Cái nào báo sai?
    hoi: CÁI NÀO BÁO SAI?
    dem: 3
    ket: a
    a:
      label: A
      note: so sánh bằng
      lines:
        - "def xong(cac_phan):"
        - "    tong = sum(cac_phan)"
        - { text: "    return tong == 1.0", diff: true }
      value: SAI 50%
    b:
      label: B
      note: so sánh gần đúng
      lines:
        - "def xong(cac_phan):"
        - "    tong = sum(cac_phan)"
        - { text: "    return isclose(tong, 1.0)", diff: true }
        - "    # math.isclose"
      value: ĐÚNG 100%
    verdict_at: 0.88
    verdict: MỘT NỬA SỐ LẦN BÁO SAI

  # ============================================ chay that
  - scene: probe
    chapter: CHẠY THẬT
    head: Một trăm nghìn lần chia đều.
    narration: Chia một công việc thành k phần bằng nhau rồi cộng ngược lại, làm một trăm nghìn lần với k đổi từ ba tới mười. Bản so sánh bằng chỉ đúng năm mươi nghìn lần. Bản so sánh gần đúng thì đúng cả trăm nghìn.
    caption: 50.000 lần đúng so với 100.000 lần đúng.
    heading: python · bench_python.py
    lenh: py repro/bench_python.py so_sanh_float
    nguon: repro/bench_python.py
    status: so_sanh_float
    lines:
      - { cmd: "chia 6 phần rồi cộng", out: "0.9999999999999999", state: bad }
      - { cmd: "`tong == 1.0` đúng",   out: "50.0%",  state: bad }
      - { cmd: "`isclose` đúng",       out: "100.0%", state: ok }
    verdict: ĐÚNG MỘT NỬA SỐ LẦN

