    caption: Trả lời được là bạn đã nắm đúng cơ chế.
    text: KIỂM MỘT SỐ THỰC CÓ BẰNG KHÔNG, CÓ AN TOÀN KHÔNG?
    size: 74
    hint: số lẽ ra bằng không có thể ra rất gần không mà không bằng
