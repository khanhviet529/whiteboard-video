# SO 49 - MUA 3, HAI DOAN CODE. Xem KE-HOACH-90.md.
#
# CO Y TRANH CHU DE TIEN. So 15 da lo phan tien roi (21,52% don bao "chua tra
# du"). O day dung ty le va chia phan, de hai video khong trung nhau.
#
# MOI CON SO do bang repro/bench_python.py, ca `so_sanh_float`:
#   100.000 lan chia 1 thanh k phan bang nhau roi cong lai
#     kiem bang `tong == 1.0`   ->  50.000 lan dung  (50,0%)
#     kiem bang `math.isclose`  -> 100.000 lan dung (100,0%)
#   chia 1 thanh 6 phan -> 0.9999999999999999
#   chia 1 thanh 7 phan -> 0.9999999999999998
#
# Ca DUNG SAI nen ket qua khong phu thuoc tai may.

