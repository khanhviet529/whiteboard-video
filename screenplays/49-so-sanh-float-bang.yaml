    narration: Chia thành hai, bốn hay tám phần thì phép so sánh bằng luôn cho kết quả đúng. Vì những số đó biểu diễn được trọn vẹn trong hệ nhị phân. Chỉ chia thành ba, sáu hay bảy phần mới lộ.
    caption: Chia 2, 4, 8 thì luôn đúng. Chia 3, 6, 7 mới lộ.
    label: CHỖ ÍT AI SOI
    value: CHIA ĐÔI THÌ KHÔNG BAO GIỜ LỘ
    size: 100
    sub: Nên ví dụ trong bài học luôn chạy đúng

  # ============================================ quy tac
  - scene: rule
    chapter: CHẶN
    accent: ok
    head: Hỏi có đủ gần không.
    narration: Quy tắc chỉ có một câu. Với số thực thì đừng hỏi có bằng nhau không, hãy hỏi có đủ gần không. Còn với thứ phải chính xác tuyệt đối như tiền thì đừng dùng số thực ngay từ đầu.
    caption: Số thực thì hỏi đủ gần. Tiền thì đừng dùng số thực.
    n: "01"
    kicker: QUY TẮC
    color: ok
    body: Số thực thì so sánh gần đúng, không so sánh bằng.
    small: Dấu hiệu trong code — dấu bằng kép hoặc khác kép đặt giữa hai biến kiểu số thực. Cả phép kiểm khác không cũng vậy, vì một số lẽ ra bằng không có thể ra một phần mười mũ mười sáu.

  # ============================================ cau hoi
