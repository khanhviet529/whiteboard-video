# MUA 3 so 36 - HAI DOAN CODE. Xem KE-HOACH-90.md.
#
# Dinh dang nay khac han mua 1: hook KHONG phai mot trieu chung production ma la
# chinh hai doan code. Suc manh nam o cho nguoi xem da trot chon trong dau truoc
# khi biet dap an, roi vao binh luan de bao ve lua chon do.
#
# Vi vay canh `code` phai la canh DAU TIEN, va no phai co du ba giay dem nguoc.
# Dat no o giua video la mat sach cai loi the do.
#
# MOI CON SO do bang repro/bench_python.py, ca `in_set`, tren chinh may nay:
#   10.000 phan tu, tim 1.429 gia tri
#   x in list  32,55 ms
#   x in set     317 us   -> 103 lan
#
# BO SO DAU TIEN PHAI BO. No do luc may dang chay mot luot render, ra 159,75ms
# va 158 lan. May ranh thi cung doan code do chi 32,55ms - lech 5 lan, va ty le
# cung doi. `bench_python.py` gio tu hieu chuan va tu choi neu may dang ban.
#
# Ty le dao 96-108 lan qua nam luot chay khac nhau, nen kich ban noi "khoang
# mot tram lan" chu khong noi mot con so le - do la do chinh xac that su co.
#
# Lop phien am BAT (`phien_am: true`), nen narration viet "API" hay "CPU" nhu
# binh thuong. Xem src/phienam.py.

title: Một dòng, nhanh hơn 100 lần
theme: bench
accent: hot
domain: be
brand: HAI ĐOẠN CODE · SỐ 01
tag: python · benchmark
footer: MỘT DÒNG KHÁC NHAU  ·  ĐO TRÊN 10.000 PHẦN TỬ
voice: female
rate: "+16%"

omni_voice: namtre_v3
style: camhung
mode: tach
phien_am: true

pause_scale: 0.70
speed: 1.03
pre_pad: 0.35
post_pad: 0.55

scenes:
  # ================================================== HOOK: chinh hai doan code
  - scene: code
    chapter: CHỌN ĐI
    head: Cái nào chậm hơn?
    narration: Hai hàm này cùng làm một việc, kiểm tra xem một giá trị có nằm trong kho mười nghìn phần tử hay không. Chúng khác nhau đúng một dòng. Bạn có ba giây để chọn, rồi tôi chạy thật cho bạn xem.
    caption: Khác đúng một dòng. Bạn chọn cái nào?
    hoi: CÁI NÀO CHẬM HƠN?
    dem: 3
    ket: b
    a:
      label: A
      note: kho là list
      lines:
        - "def co(x, kho):"
        - { text: "    kho = list(kho)", diff: true }
        - "    return x in kho"
      value: 32 ms
    b:
      label: B
      note: kho là set
      lines:
        - "def co(x, kho):"
        - { text: "    kho = set(kho)", diff: true }
        - "    return x in kho"
      value: 0,3 ms
    verdict_at: 0.88
    verdict: CHÊNH NHAU KHOẢNG 100 LẦN

  # ================================================== so do that
  - scene: probe
    chapter: CHẠY THẬT
    head: Đo trên máy, không đoán.
    narration: Đây là số đo thật, tìm một nghìn bốn trăm hai chín giá trị trong kho mười nghìn phần tử. Bản dùng list mất ba hai mili giây, bản dùng set mất ba phần mười mili giây.
    caption: 32,55ms so với 317µs trên cùng dữ liệu.
    heading: python · bench_python.py
    status: in_set
    # `lenh` go ra tung ky tu roi ket qua moi chay theo sau, `nguon` cho duong
    # dan de nguoi xem tu chay lai. Mot bang so tinh chi la loi tuyen bo.
    lenh: py repro/bench_python.py in_set
    nguon: repro/bench_python.py
    lines:
      - { cmd: "x in list",  out: "32.55 ms", state: bad }
      - { cmd: "x in set",   out: "317 µs",   state: ok }
      - { cmd: "chênh lệch", out: "103×",     state: ok }
    verdict: CÙNG KẾT QUẢ, KHÁC 103 LẦN

  # ================================================== CHIEU PHUONG PHAP
  # Canh nay tra loi cau nguoi xem co quyen hoi: "sao biet la do that?".
  # Mot bang so tinh la loi tuyen bo. Chieu chinh vong do, kem con so ve dao
  # dong, thi nguoi xem tu kiem duoc.
  #
  # So do duoc: cung mot ham chay 15 lan tren may ranh cho 34,99ms den 59,93ms,
  # trung vi 38,80ms. Mot lan do le co the lech 54% so voi trung vi.
  - scene: code
    chapter: ĐO THẾ NÀO
    head: Vì sao không đo một lần.
    narration: Đo một lần thì con số phụ thuộc vào việc máy đang làm gì lúc đó. Chạy cùng một hàm mười lăm lần cho ra từ ba lăm tới sáu mươi mili giây. Nên bộ đo chạy bảy lần rồi lấy trung vị, và tắt bộ dọn rác trong lúc đo.
    caption: Một lần đo lẻ lệch tới 54% so với trung vị.
    hoi: CÁCH NÀO ĐÁNG TIN?
    dem: 2
    ket: b
    a:
      label: A
      note: đo một lần
      lines:
        - "t0 = perf_counter()"
        - "ham()"
        - { text: "return perf_counter() - t0", diff: true }
      value: 35–60 ms
    b:
      label: B
      note: bảy lần, lấy trung vị
      lines:
        - "gc.disable()"
        - "for _ in range(7):"
        - "    t0 = perf_counter()"
        - "    ham()"
        - "    ra.append(perf_counter() - t0)"
        - { text: "return median(ra)", diff: true }
      value: 38,8 ms
    verdict_at: 0.88
    verdict: LẤY TRUNG VỊ, KHÔNG LẤY MỘT LẦN

  # ================================================== goi ten co che
  - scene: compare
    chapter: VÌ SAO
    head: Một bên đi hỏi từng cái.
    narration: Bên list thì phải so sánh lần lượt từng phần tử cho tới khi gặp, nên tìm trong kho mười nghìn thì trung bình mất năm nghìn lần so sánh. Set thì băm giá trị ra thành địa chỉ rồi nhảy thẳng tới đó, một lần là xong.
    caption: List so sánh lần lượt. Set băm ra rồi nhảy thẳng.
    vs: TRONG KHI ĐÓ
    box_h: 290
    items:
      - label: SET, BĂM RỒI NHẢY THẲNG
        value: 1 LẦN
        note: không phụ thuộc kho lớn cỡ nào
        color: ok
      - label: LIST, SO SÁNH LẦN LƯỢT
        value: 5.000 LẦN
        note: trung bình, với kho 10.000 phần tử
        color: hot

  # ================================================== cho de sai
  - scene: statement
    chapter: VÌ SAO
    head: Nó lớn lên theo dữ liệu.
    narration: Trên máy bạn kho chỉ có ba chục phần tử nên hai bản nhanh như nhau. Kho càng lớn thì khoảng cách càng xa, vì một bên đứng yên còn bên kia lớn theo số phần tử.
    caption: Kho càng lớn thì khoảng cách càng xa.
    label: CHỖ ÍT AI SOI
    value: MỘT BÊN ĐỨNG YÊN, BÊN KIA LỚN THEO KHO
    size: 92
    sub: Nên nó đi qua hết code review

  # ================================================== quy tac
  - scene: rule
    chapter: CHẶN
    accent: ok
    head: Hỏi nhiều lần thì đổi sang set.
    narration: Quy tắc chỉ có một câu. Nếu bạn hỏi cùng một kho nhiều hơn một lần, hãy đổi nó sang set trước khi vào vòng lặp. Còn hỏi đúng một lần thì list vẫn nhanh hơn, vì dựng set cũng tốn công.
    caption: Hỏi nhiều lần thì dựng set. Hỏi một lần thì thôi.
    n: "01"
    kicker: QUY TẮC
    color: ok
    body: Hỏi nhiều lần thì dựng set trước vòng lặp.
    small: Dấu hiệu trong code — một lệnh `in` nằm bên trong vòng lặp, mà vế phải là list hoặc tuple. Đổi một dòng là xong.

  # ================================================== cau hoi kiem tra co che
  - scene: ask
    chapter: CÒN LẠI
    head: Câu hỏi cuối.
    narration: Nếu kho của bạn chỉ có năm phần tử thì đổi sang set có còn đáng không? Trả lời được câu đó nghĩa là bạn đã hiểu dựng set cũng tốn một lượt duyệt.
    caption: Trả lời được là bạn đã hiểu cái giá của việc dựng set.
    text: KHO CHỈ CÓ 5 PHẦN TỬ THÌ CÒN ĐÁNG KHÔNG?
    size: 84
    # `set` KHONG duoc dung cuoi cau cuoi cua canh cuoi: no vua la tu
    # tieng Anh model tu doan, vua nhan he so ha toc x0,95, vua nam dung
    # cho cao tan sut manh nhat. Nguoi dung nghe ra "mot tieng ky la".
    hint: dựng set cũng tốn một lượt duyệt
