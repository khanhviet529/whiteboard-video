# SO 15 - MUA 1. Xem KE-HOACH-90.md.
#
# TRIEU CHUNG TRONG KE HOACH DA SAI, va do dung truoc khi viet cuu duoc.
# Ke hoach ghi "doi soat lech vai xu moi ngay, cuoi nam lech to". Do thu thi
# cong 50.000 giao dich that bang float chi lech 0,00000038 dong mot ngay, mot
# nam la 0,00014 dong - khong ai phat hien ra. Viet theo do la BIA trieu chung.
#
# Co che that nam o PHEP SO SANH, khong o tich luy sai so.
#
# MOI CON SO do bang repro/bench_python.py, ca `tien_so_sanh`:
#   100.000 don, moi don khach tra lam 2-5 lan
#   float   21.522 don bao CHUA DU du tien da du  (21,52%)
#   Decimal 0 don bao sai
#   0.1 + 0.2 == 0.3  ->  False
#
# Ca nay dung seed co dinh nen ket qua khong doi giua cac lan chay, va khong
# phu thuoc tai may - khac han cac ca do toc do.

