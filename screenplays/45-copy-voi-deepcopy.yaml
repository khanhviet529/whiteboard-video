# MOI CON SO do bang repro/bench_python.py, hai ca:
#
#   `copy_nong`  (DUNG SAI)
#     goc = {"ten": "don 1204", "hang": ["áo", "quần"]}
#     ban = copy.copy(goc);      ban["hang"].append("giày")
#       -> goc["hang"] thanh ['áo', 'quần', 'giày']   <- DINH VAO GOC
#     ban = copy.deepcopy(goc);  ban["hang"].append("giày")
#       -> goc["hang"] van la ['áo', 'quần']
#     ban sao va ban goc dung chung list?  nong True | sau False
#
#   `copy` (TOC DO) - de danh cho canh so sanh gia phai tra
#     copy.copy 4 us | copy.deepcopy 3,52 ms  tren list 2.000 phan tu
#
# Ca dung sai khong phu thuoc tai may. Ca toc do thi co, va so cua no dao
# 822-1226 lan qua cac luot nen kich ban noi "hang tram lan".

