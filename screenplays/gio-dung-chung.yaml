    ket: b
    a:
      label: A
      note: mặc định là list rỗng
      lines:
        - { text: "def them(mon, gio=[]):", diff: true }
        - "    gio.append(mon)"
        - "    return gio"
      value: SAI
    b:
      label: B
      note: mặc định là None
      lines:
        - { text: "def them(mon, gio=None):", diff: true }
        - "    gio = gio or []"
