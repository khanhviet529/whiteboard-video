# SO 38 - MUA 3, HAI DOAN CODE. Xem KE-HOACH-90.md.
#
# GIA THUYET BAN DAU CUA TOI CUNG DA SAI, giong so 50. Ke hoach ghi "noi chuoi
# trong vong lap la binh phuong" - cau nay nam trong moi bai day toi uu. Do that
# (repro/bench_python.py, ca `noi_chuoi`, 20.000 ky tu) thi chi cham khoang HAI
# LAN, khong he binh phuong.
#
# Co che: CPython co mot toi uu tai cho cho `s += x` khi chuoi `s` chi con DUNG
# MOT nguoi tham chieu - luc do no noi thang vao bo nho cu thay vi cap phat chuoi
# moi. Toi uu nay KHONG CO trong PyPy, Jython, va tat khi con bien nao khac cung
# tro vao chuoi do.
#
# CHO NGUY HIEM CUA SO NAY: de nguoi xem hieu thanh "vay cu noi thoai mai".
# Ket luan dung la nguoc lai - loi khuyen VAN DUNG, nhung ly do thi khac cai moi
# nguoi van noi, va cai toi uu kia rat de tat ma khong ai bao. Canh 4 va canh 5
# ton tai de chan cach hieu sai do.
#
# DA DO tren may ranh (hieu chuan 1.01x mocs). Ba luot lien tiep:
#   s += trong vong lap  1.21 ms | 930 us | 983 us
#   "".join(...)          462 us |  440 us | 510 us
#   ty le                  2.6x  |   2.1x  |  1.9x   -> on dinh o ~2x
#
# So TUYET DOI dao dong +-20% giua cac luot ngay ca luc may ranh, nen kich ban
# dan TY LE la chinh va so tuyet doi chi de tren man hinh. Con so tren man hinh
# lay tu luot 3, de nguoi xem chay lai thay dung mot bo so nhat quan.

