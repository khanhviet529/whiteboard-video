  # ============================================ quy tac
  - scene: rule
    chapter: CHẶN
    accent: ok
    head: Có LIMIT thì phải có ORDER BY.
    narration: Quy tắc chỉ có một câu. Hễ có mệnh đề giới hạn số dòng thì phải có mệnh đề sắp xếp đi kèm, và cột sắp xếp phải là duy nhất. Sắp theo cột trùng lặp thì các dòng bằng nhau vẫn tuỳ ý.
    caption: Có LIMIT thì phải có ORDER BY, và cột phải duy nhất.
    n: "01"
    kicker: QUY TẮC
    color: ok
    body: Có LIMIT thì phải có ORDER BY trên cột duy nhất.
    small: Dấu hiệu trong code — bất kỳ câu nào có LIMIT hoặc phân trang mà không có ORDER BY. Sắp theo ngày tạo cũng chưa đủ nếu hai bản ghi cùng một giây, phải thêm khoá chính làm cột phụ.

  # ============================================ cau hoi
  - scene: ask
    chapter: CÒN LẠI
    head: Câu hỏi cuối.
