# SO 44 - MUA 3, HAI DOAN CODE. Xem KE-HOACH-90.md.
#
# MOI CON SO do bang repro/bench_pg.py, ca `limit_khong_order`, tren
# PostgreSQL 18.4 trong WSL2. Bang 50.000 dong:
#
#   SELECT id FROM t LIMIT 5           -> [1, 2, 3, 4, 5]
#   (mot lan UPDATE 20.000 dong dau)
#   cung cau do                        -> [20001, 20002, 20003, 20004, 20005]
#
#   SELECT id FROM t ORDER BY id LIMIT 5  -> [1..5] ca truoc lan sau
#
# Day la ca DUNG SAI nen ket qua khong phu thuoc tai may - khac han cac ca do
# toc do cua cung file do.

