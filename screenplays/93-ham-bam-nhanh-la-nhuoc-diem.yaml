    narration: Cùng một mật khẩu tám chữ thường, tức hai trăm lẻ tám tỉ khả năng. Đổi hàm băm thì thời gian dò hết đổi từ ba ngày sang năm trăm năm, rồi sang một nghìn bảy trăm năm.
    caption: Cùng một mật khẩu. Ba ngày, 534 năm, 1.694 năm.
