        color: ok
      - label: KẺ ĐANG DÒ MẬT KHẨU CHỜ
        value: 0,256 GIÂY MỖI LẦN THỬ
        note: nhân với hàng tỉ lần
        color: hot

  # ================================================================ NHIP 4 + 5
  - scene: list
