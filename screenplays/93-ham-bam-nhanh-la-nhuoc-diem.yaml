    head: Cả nghề dạy chọn cái nhanh.
    narration: Suốt cả nghề này, chậm là lỗi. Mọi bảng đo, mọi vòng tối ưu đều đẩy về phía nhanh hơn. Nên khi phải chọn hàm băm mật khẩu, tay tự chọn cái nhanh nhất.
    caption: Cả nghề dạy chọn cái nhanh, nên tay tự chọn cái nhanh.
    value: TAY TỰ CHỌN CÁI NHANH NHẤT
    size: 112
    sub: Và ở đúng chỗ này thì đó là chọn sai

  # ================================================================ NHIP 3
  # Da van cach giai thich hien nhien: "cham la ton tien server".
  - scene: compare
    chapter: HIỆN TRƯỜNG
    head: Chậm cho ai và cho ai.
    narration: Một lần đăng nhập chậm thêm hai trăm năm sáu phần nghìn giây thì người dùng không nhận ra. Nhưng kẻ đang dò mật khẩu thì phải chờ đúng khoảng đó, nhân với từng lần thử một.
    caption: Người dùng chờ một lần. Kẻ dò chờ từng lần thử.
