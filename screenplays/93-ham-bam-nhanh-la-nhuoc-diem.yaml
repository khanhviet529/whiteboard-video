    head: Gọi tên thủ phạm.
    narration: Thủ phạm là chính cái ưu điểm. SHA-256 được thiết kế để bấm thật nhanh, vì nó sinh ra để kiểm tệp và ký dữ liệu. Đem đúng ưu điểm đó sang chỗ mật khẩu thì nó thành lỗ hở.
    caption: Ưu điểm của nó, đặt sai chỗ, thành lỗ hở.
    label: THỦ PHẠM
    value: ĐẶT MỘT ƯU ĐIỂM VÀO SAI CHỖ
    size: 104
    sub: Nó sinh ra để kiểm tệp, không để giữ mật khẩu

