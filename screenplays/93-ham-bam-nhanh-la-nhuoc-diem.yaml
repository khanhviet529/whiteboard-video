      - { nhan: "ARGON2ID 64MB", gia: 12.4, value: "12,4", color: ok, note: "81 mili giây" }
      - { nhan: "BCRYPT COST 12", gia: 3.9, value: "3,9", color: ok, note: "256 mili giây" }
