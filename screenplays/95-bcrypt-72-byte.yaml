# SO 95 - MUA 7 "BAM VA BI MAT".
#   chu de   : gioi han 72 byte cua bcrypt, va hai kieu no lam hong he thong
#   nguon y  : files/ke-hoach/kho-chu-de-p2.md bai 181
#   do bang  : repro/bam_va_bi_mat.py  (ca `bcrypt_72`)
#   ban do   : repro/ket-qua/mua-07-bam-va-bi-mat.txt
#
# CHO NAY DA DOI so voi moi bai viet cu ve chu de nay, va do la ly do so nay
# dang lam: ban `bcrypt` moi NEM ValueError thay vi cat am tham. Nen bay bay gio
# co HAI mat, va mat thu hai moi la mat hay gap:
#   1. code tu cat `mk[:72]` de tranh exception -> hai mat khau khac nhau cung
#      vao duoc, y nhu ngay xua
#   2. code khong cat -> nguoi dat mat khau dai KHONG DANG NHAP NOI, va thuong
#      la loi bi nuot trong mot `except Exception` roi bao "sai mat khau"
#
# MO PHONG: `cot` co `nguong`. Chon loai nay vi hinh dang cua bug la mot cai
# TRAN: bon cot dau tang deu roi hai cot cuoi CUNG chieu cao - mat doc ra chan
# tran truoc khi tai nghe xong cau giai thich. So byte thuc dung = min(do dai,
# 72), tuc phep tinh ai cung tu kiem duoc.

