# SO 54 - MUA 4, CO CHE. Xem KE-HOACH-90.md.
#
# GIA THUYET BAN DAU CUA TOI SAI, va phep kiem cuu duoc lan thu ba.
# Ke hoach dinh ke theo demo kinh dien "a = 256; b = 256 -> is True; a = 257;
# b = 257 -> is False". Chay that tren Python 3.14.6 thi CA HAI DEU RA True, ke
# ca voi 1000: trinh bien dich gop hai hang so viet thang trong cung mot khoi
# code lai lam mot. Demo do KHONG TAI HIEN DUOC.
#
# Co che that chi lo khi gia tri duoc TINH LUC CHAY. MOI CON SO do bang
# repro/bench_python.py, ca `so_nguyen_nho`, tren Python 3.14.6:
#   bang so nguyen dung chung: -5 toi 256
#   int('256') is int('256')  -> True
#   int('257') is int('257')  -> False
#   ma don 100  doc tu ngoai:  `is` True,  `==` True
#   ma don 1000 doc tu ngoai:  `is` False, `==` True
#
# Ca DUNG SAI nen ket qua khong phu thuoc tai may.
#
# Bien -5 toi 256 la chi tiet cua BAN CAI DAT chu khong phai quy dinh cua ngon
# ngu - giong so 38. Canh 5 ton tai de chan cach hieu "vay cu dung is cho so
# duoi 256".

