# SO 73 - MUA 5, JAVASCRIPT. Xem KE-HOACH-90.md.
#
# MOI KET QUA chay bang `node bench-js/su-that.mjs`, khoi `so 73`:
#   0  == "0"   true  | ===  false        ""   == []        true
#   0  == ""    true  | ===  false        null == undefined true
#   0  == false true  | ===  false        null == 0         false
#   0  == []    true  | ===  false        NaN  == NaN       false
#   [] == ![]   true         null >= 0    true  (nhung null == 0 la false)
#
#   PHA VO TINH BAC CAU:
#     0 == ""     true
#     "" == "0"   false
#     0 == "0"    true      <- neu bac cau thi dong giua phai dung
#
# CHO DAT CUA SO NAY la tinh bac cau, khong phai bang ep kieu. Bang ep kieu thi
# ai cung da thay va no chi gay cuoi. Con mat tinh bac cau nghia la khong the
# SUY LUAN bang `==`: biet a bang b va b bang c van khong ket luan duoc gi.
# Do la ly do that de bo han no, chu khong phai "vi no ky quac".
#
# SU THAT CUA DAC TA nen khong phu thuoc may.

