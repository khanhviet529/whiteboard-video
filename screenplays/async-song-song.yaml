  # ================================================================ THU PHAM
  - scene: statement
    chapter: THỦ PHẠM
    head: Gọi tên thủ phạm.
    narration: Bất đồng bộ không tạo thêm luồng nào cả. Nó chỉ cho phép một luồng bỏ dở việc đang chờ để làm việc khác, rồi quay lại. Không có chỗ chờ thì không có gì để bỏ dở.
