# SO 50 - MUA 3, HAI DOAN CODE. Xem KE-HOACH-90.md.
#
# GIA THUYET BAN DAU CUA TOI DA SAI, va phep do cuu duoc truoc khi viet.
# Ke hoach ghi "sort(key=) cham vi goi ham key moi lan so sanh" - nghe rat hop
# ly va la loi khuyen toi uu pho bien. Do that (repro/bench_python.py, ca
# `sort_key`) thi NGUOC LAI: ban `sorted(key=)` NHANH HON khoang hai lan.
#
# Co che: Python goi ham key DUNG MOT LAN moi phan tu roi giu ket qua lai
# (decorate-sort-undecorate lam san ben trong). Ban "toi uu" tay dung them mot
# danh sach tuple, roi so sanh tuple thay vi so sanh so - dat hon han.
#
# Vi vay so nay ke theo huong MOT NIEM TIN BI LAT, khong ke theo huong "doan
# code nay sai". Ca hai doan deu chay dung; cai sai la loi khuyen.
#
# DA DO tren may ranh (hieu chuan 1.01x moc). Ba luot lien tiep:
#   sorted(key=ham)      3.50 ms | 2.96 ms | 3.61 ms
#   tinh truoc roi sort  7.13 ms | 6.22 ms | 7.45 ms
#   ty le                 2.04x  |  2.10x  |  2.06x   -> rat on dinh
#
# Mot luot chay luc may hoi ban cho 6.70 va 10.27 (ty le 1.53x) - so tuyet doi
# lech hon gap doi con ty le cung tut. Vi vay ba luot chu khong mot luot.

