# Chu de KHAC HAN (N+1 query) nhung dung Y NGUYEN theme `bench` + HOOK 5 NHIP.
# File nay ton tai de chung minh mot dieu: viet kich ban moi KHONG can sua code.
# Chi doi noi dung YAML, chay lai render.py la ra video moi.
#
# Ngan hon cache-stale.yaml (8 canh) - dung lam ban mau cho dinh dang ~60 giay.
#
# MOI CON SO do bang repro/n_cong_1_truy_van.py tren chinh may nay:
#   149 cau = 1 (danh sach don) + 20 (khach) + 20 (nhom hang) + 108 (dong hang)
#   eager load: 2 cau, cung ket qua (script co assert doi chieu)
#   thoi gian chay trong sqlite: 0,4ms cho ca 149 cau
#   voi do tre 25ms moi lan di ve: 3,73 giay so voi 0,05 giay
#
# Do tre 25ms la THAM SO chu khong phai so do duoc - sqlite chay cung tien trinh
# nen do tre bang khong. Vi vay muc do tre duoc ghi thang len man hinh o canh 3,
# khong giau trong loi doc. Xem Y-TUONG.md, Cua 1.

title: 20 đơn hàng, 149 câu truy vấn
theme: bench
accent: hot
brand: HIỆN TRƯỜNG · HỒ SƠ 08
tag: orm · mô phỏng
footer: MỘT CÂU TRUY VẤN TRONG VÒNG LẶP  ·  NHÂN LÊN THEO SỐ DÒNG
voice: female
rate: "+16%"

# --- chi co tac dung khi chay `--engine omnivoice` --------------------------
# PHAI khai o day chu khong sua trong speak.py: `tts.config()` dua chung vao
# KHOA CACHE, con sua trong STYLES thi khoa khong doi -> render sau dung lai
# audio cu va thay doi khong co tac dung nao. Cac gia tri lay tu cache-stale.yaml
# sau khi da chinh bang tai.
# --- bo cau hinh omnivoice, khai o day chu KHONG de tren dong lenh -----------
# `camhung` khong phai mot "sac thai giong" ma la preset da tinh chinh: contour
# bat, retry=2, guidance_scale 2.3, class_temperature 0.5. `mode: tach` moi co
# nhanh thu lai - nhanh `lien` sinh mot phat va lay nguyen, khong kiem tra gi.
#
# De hai khoa nay tren dong lenh thi mot lan quen la ra video khac han, va da
# mat mot luot render vi dung chuyen do. Xem VIET-KICH-BAN.md.
omni_voice: namtre_v3
style: camhung
mode: tach

pause_scale: 0.70
speed: 1.03

# Mac dinh 0,45 + 0,85 = 1,3s MOI DIEM CAT. Video 8 canh mat 9,1 giay chi de im
# lang. Ha xuong 0,90s tong.
pre_pad: 0.35
post_pad: 0.55

scenes:
  # ---- NHIP 1: tinh huong quen, dong cuoi vo ly ---------------------------
  - scene: probe
    chapter: HIỆN TRƯỜNG
    head: API trả 200. Và mất 3,7 giây.
    # `API`/`OK` phien am, `caption` giu chu goc. Gop cau cuoi 19 ky tu vao cau
    # truoc: cau ngan o cuoi bi contour ha toc con 0,978 va nam o cho cao tan
    # sut manh nhat. Xem VIET-KICH-BAN.md.
    #
    # CO Y khong lo so 149 o day. No la cu lat bai o canh 5; noi truoc thi canh
    # mo phong chi con la minh hoa cho mot cau da noi roi.
    narration: Trang danh sách đơn hàng chỉ có hai mươi đơn. Ây pi ai trả về hai trăm ô kê, nhưng mất ba phẩy bảy giây.
    caption: Hai mươi đơn hàng. Ba phẩy bảy giây.
    heading: curl · rails log
    status: 200 OK
    lines:
      - { cmd: "GET /api/orders?limit=20", out: "200 OK", state: ok }
      - { cmd: "đơn trả về",               out: "20",     state: ok }
      - { cmd: "tổng thời gian",           out: "3.73s",  state: bad }
    verdict: KHÔNG MỘT LỖI NÀO

  # ---- NHIP 2: hau qua, vi sao no khong duoc sua --------------------------
  - scene: statement
    chapter: HIỆN TRƯỜNG
    head: Trên máy bạn nó nhanh.
    narration: Trên máy bạn có hai mươi đơn thì nó nhanh. Lên production có hai triệu đơn thì nó sập. Bug này lớn lên theo dữ liệu, không lớn theo code.
    caption: Bug lớn lên theo dữ liệu, không theo code.
    value: NHANH Ở LOCAL, SẬP Ở PRODUCTION
    size: 108
    sub: Nên nó đi qua hết code review

  # ---- NHIP 3: goi mo, chua dat ten benh ---------------------------------
  # Truoc day la canh `statement` thu ba, va ba con so tren man hinh khong khop
  # nhau: 143 cau, moi cau 3ms, tong 4,2 giay - nhan ra la 0,43 giay. Chay that
  # (repro/n_cong_1_truy_van.py) thi thay phan thieu nam o dau, va cho do la mot
  # phep SO SANH hai ve chu khong phai mot cau khang dinh. Doi sang `compare`
  # vua sua duoc so hoc, vua ha ty le `statement` tu 38% xuong 25%.
  - scene: compare
    chapter: HIỆN TRƯỜNG
    head: Database không hề chậm.
    narration: Chạy thật thì cả trăm câu đó chỉ tốn bốn phần mười mili giây bên trong database. Thứ ngốn hết thời gian là từng ấy lần đi về qua mạng.
    caption: 0,4ms chạy trong database. Phần còn lại là đi về.
    vs: TRONG KHI ĐÓ
    box_h: 300     # cao hon mac dinh 250: canh nay khong co verdict nen con cho
    items:
      - label: CHẠY THẬT TRONG DATABASE
        value: 0,4 MS
        note: đo bằng sqlite, cả 149 câu
        color: ok
      - label: NGƯỜI DÙNG NGỒI CHỜ
        value: 3,73 S
        note: 149 lần đi về × 25 mili giây
        color: hot

  # ---- NHIP 4 + 5: nguoi xem duoc gi, roi vao demo -----------------------
  - scene: list
    chapter: HIỆN TRƯỜNG
    head: Hết video này bạn có gì
    narration: Bạn sẽ biết cách đọc log để thấy nó ngay, và một dòng sửa nó. Giờ xem database nhận được gì.
    caption: Cách thấy nó trong log, và một dòng sửa.
    items:
      - text: Dấu hiệu trong log để nhận ra ngay trong ba giây.
        focus: true
      - text: Một dòng eager load, và khi nào nó không đủ.

  # ---- MO PHONG: 149 o hien het tren man hinh ---------------------------
  - scene: multiply
    chapter: QUAY CHẬM
    head: Một câu, rồi một trăm bốn chín câu.
    # MO DAU: khong bat dau loi doc bang "Mot cau". Am tiet dau bi nen con
    # 88ms trong khi trung vi cua chinh cau do la 112ms; "Danh" giu duoc
    # 197ms. Ca 13 loi doc cua cache-stale (ban da duyet) deu mo bang am
    # tiet ket bang nguyen am hoac phu am mui, khong cai nao ket bang phu
    # am tac. Xem VIET-KICH-BAN.md.
    #
    # DUNG `multiply` chu khong `gantt`. `gantt` tra loi cau "KHI NAO" - hai viec
    # chong len nhau theo thoi gian. Nhung N+1 khong noi ve thoi gian ma ve SO
    # LUONG bung ra, nen ep vao hai lane ngang la ke sai chuyen: nguoi xem phai
    # DOC con so "con 140 cau" thay vi NHIN THAY no.
    #
    # O luoi dau tien mau xanh (cau hop le), 148 o con lai mau do (thua) - ty le
    # 1 tren 148 hien ra ngay, khong can mot loi giai thich nao.
    narration: Danh sách này bắt đầu bằng đúng một câu truy vấn. Rồi vòng lặp bắt đầu. Mỗi đơn, ô a em lặng lẽ gửi thêm một câu để lấy tên khách, một câu nữa lấy danh sách hàng, rồi một câu cho từng dòng hàng, cứ thế nhân lên. Hai mươi đơn trên một trang thành một trăm bốn chín câu truy vấn.
    caption: Mỗi vòng lặp lặng lẽ thêm một câu truy vấn.
    source:
      label: CÂU ĐẦU TIÊN
      text: SELECT * FROM orders LIMIT 20
    counter_key: CÂU SQL
    count: 149
    cols: 12
    chip: MỖI Ô LÀ MỘT CÂU SELECT NỮA
    verdict_at: 0.92
    verdict: MỘT TRANG, 149 CÂU

  # ---- THU PHAM: mot cau ------------------------------------------------
  - scene: statement
    chapter: THỦ PHẠM
    head: Gọi tên thủ phạm.
    narration: Thủ phạm là một dòng trông vô hại nằm trong vòng lặp. Ô a em cho phép bạn viết nó như thuộc tính, nên mắt không thấy đó là một câu truy vấn.
    caption: ORM cho bạn viết truy vấn như thuộc tính.
    label: THỦ PHẠM
    value: TRUY VẤN NẰM TRONG VÒNG LẶP
    size: 112
    sub: Nhìn như thuộc tính, thực ra là một round trip

  # ---- CHAN: mot quy tac + dau hieu phat hien som -----------------------
  - scene: rule
    chapter: CHẶN
    accent: ok
    head: Nói trước là sẽ cần.
    narration: Sửa bằng eager load. Bạn nói trước với ô a em là sẽ cần tên khách và danh sách hàng, một trăm bốn chín câu gộp còn hai. Dấu hiệu phát hiện sớm là log có cùng một câu lặp lại liên tiếp.
    caption: 149 câu gộp còn 2. Log lặp lại là dấu hiệu.
    n: "01"
    kicker: QUY TẮC
    color: ok
    body: Nói trước những gì sẽ cần, đừng để vòng lặp tự hỏi.
    small: Dấu hiệu trong log — cùng một câu SELECT lặp lại liên tiếp. Đếm số câu mỗi request, cảnh báo khi vượt 20.

  # ---- CAU HOI ve he thong cua chinh nguoi xem --------------------------
  - scene: ask
    chapter: CÒN LẠI
    head: Hệ thống của bạn?
    narration: Endpoint danh sách nào của bạn đang gửi nhiều câu truy vấn nhất, và bạn có đang đếm không?
    caption: Bạn có đang đếm số câu mỗi request không?
    text: BẠN CÓ ĐANG ĐẾM SỐ CÂU SQL MỖI REQUEST?
    size: 88
    hint: bật log query rồi đếm thử một endpoint
